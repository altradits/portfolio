<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="100%" height="100%">
  <defs>
    <linearGradient id="neonCobalt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BFDBFE" />
      <stop offset="40%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="neonCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <filter id="crimsonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#F43F5E" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#E11D48" flood-opacity="0.3" />
    </filter>
  </defs>

  <g id="brand-wordmark">
    <text x="460" y="172" 
          font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="168" 
          font-weight="800" 
          letter-spacing="-3px"
          fill="url(#neonCobalt)" 
          text-anchor="middle">Altradits</text>
  </g>

  <g id="velocity-swoosh" filter="url(#crimsonGlow)">
    <path d="M 215,208 
             C 280,256 385,302 485,294 
             C 580,286 680,212 768,206 
             C 695,214 590,254 495,260 
             C 410,266 315,236 215,208 Z" 
          fill="url(#neonCrimson)" />
  </g>
</svg>