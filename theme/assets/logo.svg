<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="100%" height="100%">
  <defs>
    <!-- Cobalt Wordmark Gradient -->
    <linearGradient id="altraditsCobalt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="45%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Kinetic Crimson Swoosh Gradient -->
    <linearGradient id="altraditsCrimson" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FF6B81" />
      <stop offset="35%" stop-color="#F43F5E" />
      <stop offset="75%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>

    <!-- 3D Specular Highlight for Swoosh -->
    <linearGradient id="swooshShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Depth Filter -->
    <filter id="crispShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#040C07" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Typography: Altradits -->
  <g id="brand-wordmark" filter="url(#crispShadow)">
    <text x="460" y="172" 
          font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="168" 
          font-weight="800" 
          letter-spacing="-3px"
          fill="url(#altraditsCobalt)" 
          text-anchor="middle">Altradits</text>
  </g>

  <!-- Polished Aerodynamic Velocity Wave (Swoosh) -->
  <g id="velocity-swoosh" filter="url(#crispShadow)">
    <!-- Base Curved Blade -->
    <path d="M 215,208 
             C 280,256 385,302 485,294 
             C 580,286 680,212 768,206 
             C 695,214 590,254 495,260 
             C 410,266 315,236 215,208 Z" 
          fill="url(#altraditsCrimson)" />

    <!-- Specular Highlight Sheen Edge -->
    <path d="M 235,214 
             C 300,250 395,288 485,284 
             C 570,280 665,220 745,208 
             C 665,216 575,264 490,268 
             C 410,272 320,244 235,214 Z" 
          fill="url(#swooshShine)" />
  </g>
</svg>