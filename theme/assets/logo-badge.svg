<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" width="100%" height="100%">
  <defs>
    <linearGradient id="altraditsCobalt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="45%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="altraditsCrimson" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FF6B81" />
      <stop offset="35%" stop-color="#F43F5E" />
      <stop offset="75%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <filter id="badgeShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Solid White High-Contrast Capsule -->
  <rect x="15" y="15" width="930" height="340" rx="42" fill="#FFFFFF" filter="url(#badgeShadow)" />

  <g transform="translate(20, 20)">
    <text x="460" y="172" 
          font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="168" 
          font-weight="800" 
          letter-spacing="-3px"
          fill="url(#altraditsCobalt)" 
          text-anchor="middle">Altradits</text>

    <path d="M 215,208 
             C 280,256 385,302 485,294 
             C 580,286 680,212 768,206 
             C 695,214 590,254 495,260 
             C 410,266 315,236 215,208 Z" 
          fill="url(#altraditsCrimson)" />
  </g>
</svg>