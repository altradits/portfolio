<!DOCTYPE html>
<html lang="en" class="scroll-smooth bg-[#080808]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Christoph Nagel | Web Developer, Photographer & Videographer</title>
    <meta name="description" content="Christoph Nagel - Web developer, photographer and videographer from Dorsten in the Ruhr area. Code, Camera, Clarity.">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: {
                            950: '#040405',
                            900: '#080808',
                            850: '#0d0e12',
                            800: '#14151a',
                            750: '#1b1d24',
                            700: '#232630',
                            600: '#323644',
                        },
                        accent: {
                            red: '#ff4b3e',
                            redGlow: 'rgba(255, 75, 62, 0.2)',
                            subtle: 'rgba(255, 255, 255, 0.08)',
                        }
                    },
                    fontFamily: {
                        anton: ['Anton', 'Impact', 'sans-serif'],
                        sans: ['Manrope', 'Plus Jakarta Sans', 'system-ui', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
                    },
                    letterSpacing: {
                        'tighter-condensed': '-0.02em',
                        'widest-condensed': '0.14em',
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            color-scheme: dark;
            --bg: #080808;
            --text: #f4f4f1;
            --muted: rgba(244, 244, 241, 0.65);
            --line: rgba(255, 255, 255, 0.14);
            --glass: rgba(14, 15, 18, 0.65);
        }

        body {
            background-color: #080808;
            color: #f4f4f1;
            font-family: 'Manrope', sans-serif;
            overflow-x: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #080808;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.18);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        /* Ambient Grain Simulation */
        .ambient-grain {
            position: fixed;
            inset: -50%;
            width: 200%;
            height: 200%;
            pointer-events: none;
            opacity: 0.038;
            z-index: 99;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            background-repeat: repeat;
        }

        /* Glassmorphism helpers */
        .glass-pill {
            background: rgba(14, 15, 18, 0.65);
            backdrop-filter: blur(16px) saturate(130%);
            -webkit-backdrop-filter: blur(16px) saturate(130%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
        }

        .glass-card {
            background: rgba(18, 19, 24, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.09);
        }

        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body class="bg-[#080808] text-[#f4f4f1] antialiased selection:bg-[#ff4b3e] selection:text-white">
    <div class="ambient-grain" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
