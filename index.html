<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altradits Syndicate | Stanley Chege Thuita</title>
    <!-- Tailwind CSS CDN for instant rendering -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="theme/style.css">
</head>
<body class="bg-zinc-950 text-zinc-100 antialiased selection:bg-emerald-500 selection:text-zinc-950">

<!-- Floating Glass Navbar with Solid White Logo Badge -->
<header class="fixed top-6 left-0 right-0 z-50 flex justify-center px-4">
    <nav class="flex items-center justify-between w-full max-w-5xl px-6 py-3 bg-zinc-950/70 backdrop-blur-xl border border-zinc-800/60 rounded-full shadow-2xl">
        
        <!-- Logo with Solid White Background Badge -->
        <div class="bg-white px-3.5 py-1.5 rounded-lg shadow-md flex items-center hover:opacity-95 transition-opacity">
            <a href="#" class="flex items-center">
                <img src="theme/assets/logo.svg" 
                     onerror="this.onerror=null; this.src='assets/logo.svg'; if(!this.complete || this.naturalWidth === 0){ this.src='theme/assets/logo.png'; }" 
                     alt="Altradits" 
                     class="h-7 sm:h-8 w-auto object-contain block" />
            </a>
        </div>

        <!-- Navigation Links -->
        <div class="hidden md:flex items-center space-x-8 text-sm font-medium text-zinc-300">
            <a href="#gigs" class="hover:text-white transition-colors">Gigs</a>
            <a href="#expeditions" class="hover:text-white transition-colors">Expeditions</a>
            <a href="#network" class="hover:text-white transition-colors">Network</a>
            <a href="#shop" class="hover:text-white transition-colors">Shop</a>
            <a href="#code" class="hover:text-white transition-colors">Code</a>
        </div>

        <!-- Connect Action Button -->
        <div>
            <a href="https://wa.me/254707172370" target="_blank" rel="noopener noreferrer" class="px-4 py-2 text-xs font-semibold uppercase tracking-wider text-zinc-950 bg-emerald-400 hover:bg-emerald-300 transition-colors rounded-full shadow-lg">
                Connect ⚡
            </a>
        </div>
    </nav>
</header>

<main id="primary" class="site-main">
    <section class="relative min-h-screen bg-zinc-950 text-white flex flex-col items-center justify-center px-6 overflow-hidden">
        <!-- Background Ambient Glow -->
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(16,185,129,0.08)_0%,transparent_70%)] pointer-events-none"></div>
        
        <div class="relative z-10 max-w-4xl mx-auto text-center mt-20">
            <div class="inline-flex items-center space-x-2 px-3.5 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-semibold uppercase tracking-wider mb-6">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>Open Source Syndicate • Built by Stanley Chege Thuita</span>
            </div>
            
            <h1 class="text-4xl sm:text-6xl md:text-7xl font-extrabold tracking-tight text-white mb-6 leading-tight">
                Engineering the <span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400">Limitless Network</span>.
            </h1>
            
            <p class="text-lg sm:text-xl text-zinc-400 max-w-2xl mx-auto mb-10 leading-relaxed">
                The ultimate personal lifestyle ecosystem for remote earnings, extreme endurance challenges, global tech connections, and Bitcoin freedom.
            </p>
        </div>
    </section>
</main>

</body>
</html>
