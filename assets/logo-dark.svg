<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <linearGradient id="altraditsBlueLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="altraditsRedGlow" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FF6B72" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#EF4444" flood-opacity="0.3" />
    </filter>
  </defs>

  <g id="brand-text">
    <text x="450" y="165" 
          font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Inter', 'Outfit', 'Segoe UI', Roboto, sans-serif" 
          font-size="160" 
          font-weight="800" 
          letter-spacing="-2px"
          fill="url(#altraditsBlueLight)" 
          text-anchor="middle">Altradits</text>
  </g>

  <path d="M 230,205 
           C 275,255 375,302 460,292 
           C 560,280 670,200 760,210 
           C 680,205 570,240 480,250 
           C 400,258 310,230 230,205 Z" 
        fill="url(#altraditsRedGlow)"
        filter="url(#neonGlow)" />
</svg>